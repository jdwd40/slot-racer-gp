# Slot Rush GP with the online room server (docs/online-server.md). Install ONLY at activation, after the service passes
# its local health and smoke checks; the static-only file (slotrush.jdwd40.com.conf) remains the rollback target.
# Same origin: the static game, /api (HTTP) and /ws (WebSocket) all on slotrush.jdwd40.com; no CORS.
upstream slotrush_server {
    server 127.0.0.1:8787;
    keepalive 4;
}
server {
    listen 80;
    listen [::]:80;
    server_name slotrush.jdwd40.com;
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/www/html;
    }
    location / { return 301 https://slotrush.jdwd40.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name slotrush.jdwd40.com;
    ssl_certificate /etc/letsencrypt/live/slotrush.jdwd40.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/slotrush.jdwd40.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/www/slotrush.jdwd40.com/current;
    index index.html;
    access_log /var/log/nginx/slotrush.access.log;
    error_log /var/log/nginx/slotrush.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Compress text static assets for this site only (the shared http {} config leaves gzip_types unset).
    # /api/ and /ws turn it off below so responses carrying secrets or cookies are never compressed.
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;

    # room server: WebSocket upgrades only on /ws
    location = /ws {
        proxy_pass http://slotrush_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # never compress, and keep the upstream from negotiating permessage-deflate
        gzip off;
        proxy_set_header Sec-WebSocket-Extensions "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        # the server pings every 25 s, so a live idle socket never reaches this
        proxy_read_timeout 75s;
    }
    # room server: JSON API (health, version, accounts)
    location /api/ {
        proxy_pass http://slotrush_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 8k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        # an add_header here stops this location inheriting the server-level ones, so all of them are repeated; the room
        # server's own copies are hidden so each header is sent once
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        # responses carry session cookies and account data: never compress them here or upstream (BREACH)
        gzip off;
        proxy_set_header Accept-Encoding "";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }
    location ~ /\. { deny all; }
}
