# Isolated static game; no proxy, Node service, database or shared-site edits.
server {
    listen 80;
    listen [::]:80;
    server_name slotrush.jdwd40.com;
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/www/html;
    }
    location / { return 301 https://slotrush.jdwd40.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name slotrush.jdwd40.com;
    ssl_certificate /etc/letsencrypt/live/slotrush.jdwd40.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/slotrush.jdwd40.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/www/slotrush.jdwd40.com/current;
    index index.html;
    access_log /var/log/nginx/slotrush.access.log;
    error_log /var/log/nginx/slotrush.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Compress text static assets for this site only (the shared http {} config leaves gzip_types unset).
    # Static files only: this rollback site has no /api/ or /ws (they 404). The online file turns gzip off for both.
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }
    location ~ /\. { deny all; }
}
