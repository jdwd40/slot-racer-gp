name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Never cancel an in-flight main deployment. PR checks may supersede PR checks.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Type check, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.static.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Regression tests
        # vitest run fails when no test files are found, so an empty suite cannot pass
        run: npm test

      - name: Deployment tooling tests
        run: python3 -m unittest discover -s deploy -p 'test_*.py' -v

      - name: Production build
        # online play is live (docs/online-server.md runbook step 11); still gated at runtime by /api/health
        env:
          VITE_ONLINE: '1'
        run: npm run build

      - name: Package this checked build (no VPS rebuild)
        env:
          CHECKED_SHA: ${{ github.sha }}
        run: python3 deploy/artifact.py pack dist bundle "$CHECKED_SHA"

      - name: Retain immutable checked artifact
        id: static
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slotrush-${{ github.sha }}
          path: bundle/
          if-no-files-found: error
          retention-days: 30
          overwrite: false

  # The online room server: built, tested on PostgreSQL 17, smoke-checked and packaged as a checked artifact. It needs no
  # secrets (the database is a throwaway service container). The static deploy below waits for it (#55): an online-enabled
  # client never ships for a commit whose server/database/package/smoke checks did not pass. Nothing here deploys the
  # server: server rollout is the owner's manual runbook (docs/online-server.md).
  server:
    name: Room server build, PostgreSQL 17 tests, smoke check and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          # throwaway CI-only database inside the job's container network: not a secret
          POSTGRES_USER: slotrush_test
          POSTGRES_PASSWORD: slotrush_test_pw
          POSTGRES_DB: slotrush_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slotrush_test -d slotrush_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Database tests (migrations, accounts, profiles, sessions, admin reset, results, career awards and bests, a database outage during a race, session-store failures at sign-in) on PostgreSQL 17
        env:
          SLOTRUSH_TEST_DATABASE_URL: postgres://slotrush_test:slotrush_test_pw@127.0.0.1:5432/slotrush_test
        run: npx vitest run test/server/db.test.ts test/server/profiles.db.test.ts test/server/career.db.test.ts test/server/dbrestart.db.test.ts test/server/authstore.db.test.ts

      - name: Build the server bundle
        env:
          SLOTRUSH_BUILD: ${{ github.sha }}
        run: npm run build:server

      - name: Package the release with locked production dependencies
        run: npm run pack:server

      - name: Health and connection smoke check of the packaged release (production mode, migrated database)
        env:
          NODE_ENV: production
          SLOTRUSH_PORT: '8787'
          SLOTRUSH_ALLOWED_ORIGINS: https://slotrush.jdwd40.com
          DATABASE_URL: postgres://slotrush_test:slotrush_test_pw@127.0.0.1:5432/slotrush_test
          SLOTRUSH_SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else
          SLOTRUSH_SPOOL_DIR: ${{ runner.temp }}/slotrush-spool
        run: |
          rel="$(ls -d server-bundle/slotrush-server-*/)"
          psql_reset='DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
          PGPASSWORD=slotrush_test_pw psql -h 127.0.0.1 -U slotrush_test -d slotrush_test -c "$psql_reset"
          (cd "$rel" && node server-dist/admin.mjs migrate)
          (cd "$rel" && exec node --max-old-space-size=96 --max-semi-space-size=2 server-dist/main.mjs) > server.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/api/health >/dev/null 2>&1 && break; sleep 1; done
          set +e
          node scripts/server-smoke.mjs http://127.0.0.1:8787 --origin https://slotrush.jdwd40.com --expect "$rel/server-dist/protocol.json"
          status=$?
          kill "$pid" || true
          cat server.log
          exit "$status"

      - name: Retain the checked server release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slotrush-server-${{ github.sha }}
          path: |
            server-bundle/*.tar.gz
            server-bundle/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
          overwrite: false

  deploy:
    name: Deploy checked static artifact
    # Both validation jobs must succeed for this exact commit (#55). success() is false when any needed job failed, was
    # cancelled or was skipped, and the explicit result checks keep that true if this condition is ever edited. Never add
    # always(), failure(), cancelled() or continue-on-error to this gate (test/ciworkflow.test.ts checks it). PRs never deploy.
    needs: [check, server]
    if: success() && needs.check.result == 'success' && needs.server.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    concurrency:
      group: slotrush-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download only the artifact from the successful prerequisite job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.check.outputs.artifact-id }}
          merge-multiple: true
          path: bundle

      - name: Configure dedicated SSH identity and verified host key
        env:
          DEPLOY_KEY: ${{ secrets.SLOTRUSH_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SLOTRUSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/slotrush-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/slotrush-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/slotrush-ssh/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/slotrush-ssh/key" >/dev/null
          ssh-keygen -F '[213.165.91.221]:4020' -f "$RUNNER_TEMP/slotrush-ssh/known_hosts" >/dev/null

      - name: Atomic deploy, verify all public bytes, rollback on verification failure
        env:
          SLOTRUSH_KEY_FILE: ${{ runner.temp }}/slotrush-ssh/key
          SLOTRUSH_HOSTS_FILE: ${{ runner.temp }}/slotrush-ssh/known_hosts
        run: bash deploy/run.sh bundle

      - name: Remove ephemeral SSH files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/slotrush-ssh"
